[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-task"
version = "1.0.0"
description = "Zero-dependency durable task queue for AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "OpenClaw", email = "hussain.alsaibai@gmail.com"}]
keywords = ["task-queue", "background-jobs", "durable-queue", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-task"
Repository = "https://github.com/hussain-alsaibai/tiny-task"
Issues = "https://github.com/hussain-alsaibai/tiny-task/issues"

[tool.setuptools]
py-modules = ["tiny_task"]

[tool.pytest.ini_options]
testpaths = ["test_tiny_task.py"]
python_files = ["test_*.py"]
